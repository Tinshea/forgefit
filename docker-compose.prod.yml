# Déploiement à partir d'images publiées.
#
# Aucune construction : les images viennent de GHCR, publiées par
# .github/workflows/docker.yml. C'est ce fichier qu'on colle dans
# l'éditeur web de Portainer — l'autre (docker-compose.yml) construit
# depuis les sources et exige la méthode « Repository ».
#
# Mettre à jour l'application :
#   Portainer → Stacks → forgefit → « Update the stack »
#   en cochant « Re-pull image ». Aucune reconstruction, quelques
#   secondes d'indisponibilité.

name: forgefit

services:
  db:
    # Image portant le schéma : aucun montage depuis le disque, donc
    # déployable depuis l'éditeur web de Portainer, où le serveur n'a
    # aucune copie des sources.
    image: ghcr.io/${GITHUB_OWNER:-tinshea}/forgefit-db:${TAG:-latest}
    container_name: forgefit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir un mot de passe}
      POSTGRES_DB: ${POSTGRES_DB:-forgefit}
    volumes:
      # Le schéma ne s'applique qu'au premier démarrage, sur un volume
      # vide. Mettre à jour l'image ne le rejoue pas.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgefit} -d ${POSTGRES_DB:-forgefit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forgefit-internal

  api:
    image: ghcr.io/${GITHUB_OWNER:-tinshea}/forgefit-api:${TAG:-latest}
    container_name: forgefit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-forgefit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-forgefit}
      # Sans secret, la signature des webhooks n'est PAS vérifiée :
      # n'importe qui peut injecter de fausses mesures.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?definir un secret}
      # Jeton porteur : l'app Raccourcis d'iOS n'a aucune action de
      # hachage HMAC et ne peut donc pas signer ses envois. Sans ce
      # jeton, le raccourci de synchronisation Sante est refuse.
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      # Nom stable de l'hote sur le reseau local (« serveur.local ») :
      # l'IP est distribuee par le routeur et change au redemarrage, ce
      # qui perime l'adresse figee dans le raccourci.
      MDNS_HOST: ${MDNS_HOST:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      EXERCISES_DATASET_URL: ${EXERCISES_DATASET_URL:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json}
      EXERCISES_MEDIA_BASE: ${EXERCISES_MEDIA_BASE:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main}
    ports:
      - "${API_PORT:-3000}:3000"
    labels:
      # Watchtower ne touche QUE ce qui porte cette etiquette.
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - forgefit-internal
      - forgefit-mesh

  web:
    # L'image est construite avec VITE_API_BASE vide : le front appelle
    # sa propre origine et nginx relaie vers l'api. Elle est donc
    # portable — aucune reconstruction par environnement.
    image: ghcr.io/${GITHUB_OWNER:-tinshea}/forgefit-web:${TAG:-latest}
    container_name: forgefit-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    labels:
      # Watchtower ne touche QUE ce qui porte cette etiquette.
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - forgefit-internal

  # ┌─ MISE A JOUR AUTOMATIQUE ────────────────────────────────────────┐
  # │ Watchtower interroge GHCR et redemarre un conteneur des qu'une   │
  # │ image plus recente y apparait. Le workflow publie a chaque push  │
  # │ sur `main` : pousser suffit donc a deployer.                     │
  # │                                                                   │
  # │ POURQUOI TIRER PLUTOT QUE RECEVOIR : un webhook de GitHub vers   │
  # │ la maison supposerait d'ouvrir un port depuis Internet jusqu'au  │
  # │ home lab. Tirer ne demande rien : le serveur sort, personne      │
  # │ n'entre.                                                         │
  # │                                                                   │
  # │ FACULTATIF, et c'est voulu : le service ne demarre qu'avec le    │
  # │ profil `auto`. Une mise a jour qui se declenche seule est un     │
  # │ choix, pas un defaut — elle peut tomber pendant une seance.      │
  # │   docker compose -f docker-compose.prod.yml --profile auto up -d │
  # │                                                                   │
  # │ La BASE est volontairement exclue du perimetre : on ne remplace  │
  # │ pas une base de donnees dans le dos de son proprietaire.         │
  # └───────────────────────────────────────────────────────────────────┘
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: forgefit-watchtower
    restart: unless-stopped
    profiles: ["auto"]
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}
    volumes:
      # Lecture seule : Watchtower a besoin de parler au demon, pas de
      # pouvoir tout y faire.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Images privees sur GHCR : fournir un jeton en lecture de paquets.
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_TOKEN:-}

networks:
  forgefit-internal:
    driver: bridge
  forgefit-mesh:
    driver: bridge
    name: ${MESH_NETWORK:-forgefit-mesh}

volumes:
  db_data:
