name: forgefit

services:
  db:
    image: postgres:16-alpine
    container_name: forgefit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgefit}
      POSTGRES_DB: ${POSTGRES_DB:-forgefit}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Scripts run in lexical order on first boot of an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgefit} -d ${POSTGRES_DB:-forgefit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forgefit-internal
    # No published port: the DB is only reachable from the internal network.
    # Uncomment for local psql access from the host.
    # ports: ["5432:5432"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgefit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-forgefit}:${POSTGRES_PASSWORD:-forgefit}@db:5432/${POSTGRES_DB:-forgefit}
      # Shared secret for HMAC verification of inbound health webhooks.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret-change-me}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      # Nom mDNS de la machine hote (« quelquechose.local »).
      #
      # Une adresse IP de reseau local est distribuee par le routeur et
      # CHANGE : au redemarrage, la machine est passee de .148 a .144, et
      # l'adresse figee dans le raccourci iOS est devenue fausse du jour
      # au lendemain. Le nom mDNS, lui, ne bouge pas — l'iPhone le
      # resout nativement par Bonjour.
      MDNS_HOST: ${MDNS_HOST:-}
      # Comma-separated origins allowed to call the API from a browser.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      EXERCISES_DATASET_URL: ${EXERCISES_DATASET_URL:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json}
      # Media lives at the REPO ROOT, not under /data — see scripts/ingest.js.
      EXERCISES_MEDIA_BASE: ${EXERCISES_MEDIA_BASE:-https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - forgefit-internal
      - forgefit-mesh

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VIDE par défaut, et c'est volontaire.
        #
        # Vite INLINE cette valeur dans le bundle au moment du build : ce
        # n'est pas une variable lue à l'exécution. Y mettre
        # « http://localhost:3000 » ferait appeler au navigateur SA
        # PROPRE machine — l'app ne fonctionnerait que depuis l'hôte
        # Docker lui-même.
        #
        # Vide, les requêtes partent en relatif vers la même origine, et
        # nginx les relaie vers le conteneur api (cf. nginx.conf). C'est
        # aussi ce qui évite tout préflight CORS en production.
        #
        # À ne renseigner que si l'API est servie sur un domaine
        # RÉELLEMENT distinct du front.
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: forgefit-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - forgefit-internal

networks:
  # Pont privé : db <-> api <-> web. Injoignable par les stacks voisines.
  forgefit-internal:
    driver: bridge

  # Maillage partagé : c'est par là que cette stack s'intègre à un
  # pipeline de données plus large. Les services voisins joignent l'API
  # à http://forgefit-api:3000.
  #
  # Volontairement NON externe : un réseau `external: true` doit exister
  # avant le déploiement, sinon la stack échoue avec « network not
  # found » — piège classique sur Portainer, où l'on n'a pas forcément
  # de shell pour lancer `docker network create`.
  #
  # `name:` fige le nom du réseau indépendamment du nom de la stack, donc
  # une autre stack peut s'y rattacher de façon prévisible :
  #   networks: { forgefit-mesh: { external: true, name: forgefit-mesh } }
  forgefit-mesh:
    driver: bridge
    name: ${MESH_NETWORK:-forgefit-mesh}

volumes:
  db_data:
