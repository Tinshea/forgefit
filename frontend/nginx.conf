server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ┌─ PRECOMPRESSION ────────────────────────────────────────────────┐
  # │ `gzip_static` sert le fichier `.gz` depose a cote de l'original  │
  # │ s'il existe. Il est compresse AU BUILD, au niveau 9, une fois    │
  # │ pour toutes — la compresses a la volee coute du processeur a     │
  # │ chaque requete et s'arrete au niveau 5 ou 6 pour ne pas trop en  │
  # │ coûter. Precompresse, on obtient un fichier plus petit ET aucun  │
  # │ calcul au service.                                               │
  # │                                                                   │
  # │ `gzip on` reste en repli pour ce qui n'a pas de `.gz` : les      │
  # │ reponses de l'API, notamment.                                     │
  # └───────────────────────────────────────────────────────────────────┘
  gzip_static on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # SPA : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Les assets Vite portent un hash dans leur nom : immuables.
  #
  # `expires` et `add_header Cache-Control` emettaient DEUX en-tetes
  # concurrents. Une seule directive, explicite, evite qu'un cache
  # intermediaire choisisse pour nous.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Le service worker ne doit JAMAIS etre mis en cache : c'est lui qui
  # decide de la duree de vie de tout le reste. Un `sw.js` perime fige
  # l'application sur une ancienne version, et c'est la panne la plus
  # penible a diagnostiquer.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Relais vers l'API sur le reseau interne Docker : le navigateur ne
  # voit qu'une origine, ce qui evite tout preflight CORS en production.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Un export Apple Health complet peut etre volumineux et lent.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }
}
