server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Les assets Vite portent un hash dans leur nom : immuables.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Relais vers l'API sur le reseau interne Docker : le navigateur ne
  # voit qu'une origine, ce qui evite tout preflight CORS en production.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Un export Apple Health complet peut etre volumineux et lent.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }
}
